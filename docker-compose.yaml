services:
  bot_postgres:
    image: postgres:16-alpine
    container_name: final_bot_postgres_v5
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    networks:
      - custom_bot_network
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot_n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: final_bot_n8n_v5
    restart: always
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_HOST=${N8N_HOST}
      - N8N_PROTOCOL=https
      - GENERIC_TIMEZONE=Europe/Moscow
      - TZ=Europe/Moscow
    extra_hosts:
      - "docker.internal:host-gateway"
    depends_on:
      bot_postgres:
        condition: service_healthy
    networks:
      - custom_bot_network
    volumes:
      - ./n8n_storage:/home/node/.n8n

networks:
  custom_bot_network:
    driver: bridge
